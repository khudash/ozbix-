<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ozbix Admin — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f0a0b; color: #f1f5f9; }
        .form-input {
            width: 100%; padding: .7rem 1rem; border-radius: .65rem;
            background: rgba(0,0,0,.4); border: 1px solid rgba(171,31,43,.3);
            color: #f1f5f9; font-size: .85rem; outline: none; transition: border-color .2s;
        }
        .form-input:focus { border-color: #ab1f2b; }
        .pl-input { padding-left: 2.75rem; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Background Glow -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 rounded-full blur-3xl"
             style="background: rgba(171,31,43,.15);"></div>
        <div class="absolute bottom-1/4 right-1/4 w-72 h-72 rounded-full blur-3xl"
             style="background: rgba(139,10,20,.1);"></div>
    </div>

    <div class="w-full max-w-md relative z-10 space-y-6">

        <!-- Brand -->
        <div class="text-center space-y-3">
            <div class="w-16 h-16 mx-auto rounded-2xl flex items-center justify-center text-white font-black text-3xl"
                 style="background: linear-gradient(135deg,#cc2535,#771d24); box-shadow: 0 8px 24px -4px rgba(171,31,43,.55);">
                O
            </div>
            <div>
                <h1 class="text-2xl font-extrabold text-white tracking-tight">Ozbix Admin Panel</h1>
                <p class="text-xs text-slate-400 mt-0.5">Apne credentials se login karein</p>
            </div>
        </div>

        <!-- Alerts -->
        {% if messages %}
        <div class="space-y-2">
            {% for message in messages %}
            <div class="p-3.5 rounded-xl text-xs flex items-center gap-2.5 border
                {% if message.tags == 'error' %}border-rose-500/40 bg-rose-950/40 text-rose-200
                {% else %}border-ozbix-700/40 bg-ozbix-950/40 text-ozbix-200{% endif %}">
                <i class="fa-solid fa-circle-exclamation"></i>
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <!-- Login Card -->
        <div class="rounded-3xl p-8 space-y-5"
             style="background: rgba(26,14,15,.9); border: 1px solid rgba(171,31,43,.2);
                    box-shadow: 0 20px 48px -8px rgba(0,0,0,.7);">
            <form method="POST" action="{% url 'dashboard_login' %}" class="space-y-4">
                {% csrf_token %}

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                            <i class="fa-solid fa-user text-sm"></i>
                        </span>
                        <input type="text" name="username" required placeholder="admin"
                               class="form-input pl-input">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                        <input type="password" name="password" required placeholder="••••••••"
                               class="form-input pl-input">
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-3 rounded-xl font-extrabold text-sm text-white transition-all"
                        style="background: linear-gradient(135deg,#cc2535,#8e1d27); box-shadow: 0 6px 18px -4px rgba(171,31,43,.5);"
                        onmouseover="this.style.filter='brightness(1.1)'"
                        onmouseout="this.style.filter='brightness(1)'">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i> Sign In to Dashboard
                </button>
            </form>

            <div class="pt-3 border-t border-[rgba(171,31,43,.15)] text-center">
                <a href="{% url 'home' %}" class="text-xs text-slate-500 hover:text-white transition-colors flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i> Website par wapis jayein
                </a>
            </div>
        </div>

        <p class="text-center text-[11px] text-slate-600">&copy; 2026 Ozbix IT Solutions. Powered by Django & PostgreSQL.</p>
    </div>
</body>
</html>
