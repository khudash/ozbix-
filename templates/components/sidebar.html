{% load static %}

<!-- ============= SIDEBAR COMPONENT =============-->
<div id="sidebar"
     class="hidden xl:flex fixed left-0 top-0 h-screen w-20 bg-white border-r border-gray-200 flex-col justify-center items-center z-40 transition-all duration-300 shadow-sm">

    <div class="flex flex-col items-center gap-20">
        <!-- Get In Touch Button & Chat Icon -->
        <div class="flex flex-col items-center group">
            <button type="button" onclick="openModal()"
                    class="rotate-[-90deg] whitespace-nowrap text-xs font-extrabold tracking-widest text-gray-800 hover:text-[#ab1f2b] transition-colors cursor-pointer mb-14 select-none">
                GET IN TOUCH
            </button>
            <button type="button" onclick="openModal()"
                    class="w-10 h-10 rounded-full bg-red-50 hover:bg-[#ab1f2b] text-[#ab1f2b] hover:text-white flex items-center justify-center transition-all duration-300 shadow-sm hover:scale-110 cursor-pointer"
                    title="Get In Touch">
                <i class="fa-regular fa-comment-dots text-lg"></i>
            </button>
        </div>

        <!-- WhatsApp Button & Icon -->
        <div class="flex flex-col items-center group">
            <a href="https://wa.me/{{ site.whatsapp_number|default:'923175448546'|cut:' '|cut:'+' }}" target="_blank"
               class="rotate-[-90deg] whitespace-nowrap text-xs font-extrabold tracking-widest text-gray-800 hover:text-emerald-600 transition-colors cursor-pointer mb-12 select-none">
                WHATSAPP
            </a>
            <a href="https://wa.me/{{ site.whatsapp_number|default:'923175448546'|cut:' '|cut:'+' }}" target="_blank"
               class="w-10 h-10 rounded-full bg-emerald-50 hover:bg-emerald-600 text-emerald-600 hover:text-white flex items-center justify-center transition-all duration-300 shadow-sm hover:scale-110 cursor-pointer"
               title="Chat on WhatsApp">
                <i class="fa-brands fa-whatsapp text-xl"></i>
            </a>
        </div>
    </div>
</div>
