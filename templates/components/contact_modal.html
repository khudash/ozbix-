{% load static %}

<!-- ==================== GET IN TOUCH / CONTACT MODAL ==================== -->
<div id="modal" class="hidden fixed inset-0 z-[9999] bg-black/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 md:p-6 transition-all duration-300">
    <!-- Modal Card Container -->
    <div class="relative w-full max-w-lg bg-white rounded-2xl shadow-2xl border border-gray-100 flex flex-col my-auto max-h-[92vh] overflow-hidden animate-in fade-in zoom-in-95 duration-200">
        
        <!-- Header -->
        <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-gradient-to-r from-red-50/50 via-white to-white">
            <div>
                <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-red-100 text-[#ab1f2b] tracking-wider uppercase">
                    <i class="fa-solid fa-paper-plane text-[9px]"></i> Get In Touch
                </span>
                <h3 class="text-xl sm:text-2xl font-black text-gray-900 mt-1">
                    Let's Talk With Us
                </h3>
                <p class="text-xs text-gray-500">
                    Share your requirements and we'll reply within 24 hours.
                </p>
            </div>
            <button type="button" onclick="closeModal()" aria-label="Close modal"
                    class="w-9 h-9 rounded-full bg-gray-100 hover:bg-red-100 hover:text-[#ab1f2b] text-gray-500 flex items-center justify-center transition-colors cursor-pointer self-start">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Form Body (Scrollable) -->
        <form method="POST" action="{% url 'contact' %}" class="flex flex-col flex-1 overflow-hidden m-0">
            {% csrf_token %}
            <div class="p-5 sm:p-6 overflow-y-auto space-y-4 flex-1">
                
                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                        Full Name <span class="text-red-600">*</span>
                    </label>
                    <div class="relative">
                        <i class="fa-regular fa-user absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                        <input
                            type="text"
                            name="full_name"
                            placeholder="e.g. John Doe"
                            required
                            class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-gray-200 focus:border-[#ab1f2b] focus:ring-2 focus:ring-red-100 outline-none text-sm transition placeholder-gray-400"
                        >
                    </div>
                </div>

                <!-- Email & Phone Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                            Email <span class="text-red-600">*</span>
                        </label>
                        <div class="relative">
                            <i class="fa-regular fa-envelope absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                            <input
                                type="email"
                                name="email"
                                placeholder="name@company.com"
                                required
                                class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-gray-200 focus:border-[#ab1f2b] focus:ring-2 focus:ring-red-100 outline-none text-sm transition placeholder-gray-400"
                            >
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                            Phone / WhatsApp <span class="text-red-600">*</span>
                        </label>
                        <div class="relative">
                            <i class="fa-solid fa-phone absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                            <input
                                type="tel"
                                name="phone"
                                placeholder="+92 300 1234567"
                                required
                                class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-gray-200 focus:border-[#ab1f2b] focus:ring-2 focus:ring-red-100 outline-none text-sm transition placeholder-gray-400"
                            >
                        </div>
                    </div>
                </div>

                <!-- Services Checklist (Compact Pill Badges) -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                        Choose Services of Interest
                    </label>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                        <label class="flex items-center gap-2 p-2 rounded-lg border border-gray-200 text-xs font-medium text-gray-700 hover:border-[#ab1f2b] hover:bg-red-50/40 cursor-pointer transition select-none has-[:checked]:bg-red-50 has-[:checked]:border-[#ab1f2b] has-[:checked]:text-[#ab1f2b]">
                            <input type="checkbox" name="services" value="Website Development" class="accent-[#ab1f2b] w-3.5 h-3.5 rounded">
                            <span>Web Dev</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 rounded-lg border border-gray-200 text-xs font-medium text-gray-700 hover:border-[#ab1f2b] hover:bg-red-50/40 cursor-pointer transition select-none has-[:checked]:bg-red-50 has-[:checked]:border-[#ab1f2b] has-[:checked]:text-[#ab1f2b]">
                            <input type="checkbox" name="services" value="Shopify Solutions" class="accent-[#ab1f2b] w-3.5 h-3.5 rounded">
                            <span>Shopify</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 rounded-lg border border-gray-200 text-xs font-medium text-gray-700 hover:border-[#ab1f2b] hover:bg-red-50/40 cursor-pointer transition select-none has-[:checked]:bg-red-50 has-[:checked]:border-[#ab1f2b] has-[:checked]:text-[#ab1f2b]">
                            <input type="checkbox" name="services" value="WordPress Development" class="accent-[#ab1f2b] w-3.5 h-3.5 rounded">
                            <span>WordPress</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 rounded-lg border border-gray-200 text-xs font-medium text-gray-700 hover:border-[#ab1f2b] hover:bg-red-50/40 cursor-pointer transition select-none has-[:checked]:bg-red-50 has-[:checked]:border-[#ab1f2b] has-[:checked]:text-[#ab1f2b]">
                            <input type="checkbox" name="services" value="Digital Marketing" class="accent-[#ab1f2b] w-3.5 h-3.5 rounded">
                            <span>Marketing</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 rounded-lg border border-gray-200 text-xs font-medium text-gray-700 hover:border-[#ab1f2b] hover:bg-red-50/40 cursor-pointer transition select-none has-[:checked]:bg-red-50 has-[:checked]:border-[#ab1f2b] has-[:checked]:text-[#ab1f2b]">
                            <input type="checkbox" name="services" value="SEO Optimization" class="accent-[#ab1f2b] w-3.5 h-3.5 rounded">
                            <span>SEO</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 rounded-lg border border-gray-200 text-xs font-medium text-gray-700 hover:border-[#ab1f2b] hover:bg-red-50/40 cursor-pointer transition select-none has-[:checked]:bg-red-50 has-[:checked]:border-[#ab1f2b] has-[:checked]:text-[#ab1f2b]">
                            <input type="checkbox" name="services" value="Graphic Designing" class="accent-[#ab1f2b] w-3.5 h-3.5 rounded">
                            <span>Graphic Design</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 rounded-lg border border-gray-200 text-xs font-medium text-gray-700 hover:border-[#ab1f2b] hover:bg-red-50/40 cursor-pointer transition select-none has-[:checked]:bg-red-50 has-[:checked]:border-[#ab1f2b] has-[:checked]:text-[#ab1f2b]">
                            <input type="checkbox" name="services" value="Software Services" class="accent-[#ab1f2b] w-3.5 h-3.5 rounded">
                            <span>Software / App</span>
                        </label>
                        <label class="flex items-center gap-2 p-2 rounded-lg border border-gray-200 text-xs font-medium text-gray-700 hover:border-[#ab1f2b] hover:bg-red-50/40 cursor-pointer transition select-none has-[:checked]:bg-red-50 has-[:checked]:border-[#ab1f2b] has-[:checked]:text-[#ab1f2b]">
                            <input type="checkbox" name="services" value="Other Services" class="accent-[#ab1f2b] w-3.5 h-3.5 rounded">
                            <span>Other Services</span>
                        </label>
                    </div>
                </div>

                <!-- Message -->
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1.5">
                        Project Details / Message <span class="text-red-600">*</span>
                    </label>
                    <textarea
                        name="message"
                        rows="3"
                        placeholder="Tell us briefly about your goals, timeline, or requirements..."
                        required
                        class="w-full p-3 rounded-xl border border-gray-200 focus:border-[#ab1f2b] focus:ring-2 focus:ring-red-100 outline-none text-sm transition placeholder-gray-400 resize-none"
                    ></textarea>
                </div>
            </div>

            <!-- Footer Action Bar -->
            <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-3">
                <div class="flex items-center gap-2 text-xs text-gray-500">
                    <span>Or quick chat:</span>
                    <a href="https://wa.me/{{ site.whatsapp_number|default:'923175448546'|cut:' '|cut:'+' }}" target="_blank"
                       class="text-emerald-600 hover:text-emerald-700 font-semibold inline-flex items-center gap-1 transition">
                        <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp
                    </a>
                </div>

                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button type="button" onclick="closeModal()"
                            class="px-4 py-2.5 rounded-xl border border-gray-200 text-xs font-bold text-gray-600 hover:bg-gray-100 transition cursor-pointer">
                        Cancel
                    </button>
                    <button type="submit"
                            class="flex-1 sm:flex-none px-6 py-2.5 rounded-xl bg-[#ab1f2b] hover:bg-[#8d1923] text-white text-xs font-bold uppercase tracking-wider shadow-md shadow-red-900/20 hover:shadow-lg transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <span>Send Message</span>
                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
    // Universal Modal Helper Functions
    function openModal(id) {
        const targetModal = (id && typeof id === 'string') ? document.getElementById(id) : document.getElementById('modal');
        if (targetModal) {
            targetModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
    }

    function closeModal(id) {
        const targetModal = (id && typeof id === 'string') ? document.getElementById(id) : document.getElementById('modal');
        if (targetModal) {
            targetModal.classList.add('hidden');
            document.body.style.overflow = '';
        }
    }

    // Close on backdrop click & ESC key
    document.addEventListener('DOMContentLoaded', function() {
        const modalEl = document.getElementById('modal');
        if (modalEl) {
            modalEl.addEventListener('click', function(e) {
                if (e.target === modalEl) {
                    closeModal('modal');
                }
            });
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal('modal');
            }
        });
    });
</script>
